services:
  - type: web
    name: mode-key-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: KHMER_API_KEY
        sync: false
      - key: KHMER_PROFILE_KEY
        sync: false
      - key: CHANNEL_ID
        sync: false
